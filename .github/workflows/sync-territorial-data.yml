name: Sync national territorial data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - ".github/workflows/sync-territorial-data.yml"

permissions:
  contents: write

jobs:
  sync-asl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download national territorial datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          curl -fL --retry 4 --retry-delay 3 \
            "https://www.dati.salute.gov.it/sites/default/files/2026-05/ASL_comuni_popolazione_2024.csv" \
            -o data/asl_comuni.csv

          curl -fL --retry 4 --retry-delay 3 \
            "https://www.dati.salute.gov.it/sites/default/files/2026-04/ASL_2010-2026.csv" \
            -o data/asl_elenco.csv

          curl -fL --retry 4 --retry-delay 3 \
            "https://www.lavoro.gov.it/temi-e-priorita-poverta-ed-esclusione-sociale/focus/registro-ambiti-territoriali-siuss" \
            -o data/ats_registry.xlsx

          test -s data/asl_comuni.csv
          test -s data/asl_elenco.csv
          test -s data/ats_registry.xlsx

      - name: Prepare XLSX reader
        shell: bash
        run: python -m pip install --quiet openpyxl

      - name: Validate and normalize datasets
        shell: python
        run: |
          from pathlib import Path
          import csv, io

          path = Path("data/asl_comuni.csv")
          raw = path.read_bytes()
          text = None
          for enc in ("utf-8-sig", "utf-8", "cp1252", "latin-1"):
              try:
                  text = raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          if not text:
              raise SystemExit("Unable to decode Ministry dataset")

          first = text.splitlines()[0]
          delimiter = max((";", ",", "\t"), key=lambda d: first.count(d))
          reader = csv.reader(io.StringIO(text), delimiter=delimiter)
          rows = list(reader)
          if len(rows) < 1000:
              raise SystemExit(f"Dataset unexpectedly small: {len(rows)} rows")

          headers = [" ".join(h.lower().strip().split()) for h in rows[0]]
          required = ["denominazione regione", "codice azienda", "denominazione azienda", "comune"]
          missing = [x for x in required if x not in headers]
          if missing:
              raise SystemExit(f"Missing expected fields: {missing}")

          print(f"Validated {len(rows)-1} municipality/ASL rows")

          asl_path = Path("data/asl_elenco.csv")
          asl_raw = asl_path.read_bytes()
          asl_text = None
          for enc in ("utf-8-sig", "utf-8", "cp1252", "latin-1"):
              try:
                  asl_text = asl_raw.decode(enc)
                  break
              except UnicodeDecodeError:
                  pass
          if not asl_text or len(asl_text.splitlines()) < 100:
              raise SystemExit("ASL registry dataset unexpectedly small")
          print(f"Validated ASL registry with {len(asl_text.splitlines())-1} rows")

          from openpyxl import load_workbook
          ats_path = Path("data/ats_registry.xlsx")
          wb = load_workbook(ats_path, read_only=True, data_only=True)
          ws = wb[wb.sheetnames[0]]
          raw_rows = list(ws.iter_rows(values_only=True))
          header_idx = None
          for i, row in enumerate(raw_rows[:30]):
              vals = [str(v).strip() if v is not None else "" for v in row]
              joined = " ".join(vals).lower()
              if "ambit" in joined and ("region" in joined or "codic" in joined or "comun" in joined):
                  header_idx = i
                  break
          if header_idx is None:
              raise SystemExit("Unable to identify ATS registry header")
          rows = raw_rows[header_idx:]
          out = Path("data/ats_registry.csv")
          with out.open("w", encoding="utf-8", newline="") as fh:
              writer = csv.writer(fh, delimiter=";")
              for row in rows:
                  writer.writerow(["" if v is None else str(v).strip() for v in row])
          if out.stat().st_size < 1000:
              raise SystemExit("ATS registry CSV unexpectedly small")
          print(f"Normalized ATS registry: {len(rows)-1} data rows from sheet {ws.title!r}")

          # Build coverage statistics used by the Carevia UI.
          import json, datetime
          asl_rows_count = len(list(csv.reader(io.StringIO(text), delimiter=delimiter))) - 1
          health_rows = list(csv.reader(io.StringIO(text), delimiter=delimiter))[1:]
          health_headers = [" ".join(h.lower().strip().split()) for h in list(csv.reader(io.StringIO(text), delimiter=delimiter))[0]]
          h_region = health_headers.index("denominazione regione")
          h_code = health_headers.index("codice azienda")
          h_name = health_headers.index("denominazione azienda")
          h_city = health_headers.index("comune")
          unique_health_cities = {(r[h_region].strip(), r[h_city].strip()) for r in health_rows if len(r) > max(h_region,h_city)}
          unique_health_authorities = {(r[h_region].strip(), r[h_code].strip(), r[h_name].strip()) for r in health_rows if len(r) > max(h_region,h_code,h_name)}

          ats_csv = list(csv.reader(out.open("r", encoding="utf-8"), delimiter=";"))
          ats_headers = [" ".join(h.lower().strip().split()) for h in ats_csv[0]]
          a_region = ats_headers.index("regione")
          a_area = next(i for i,h in enumerate(ats_headers) if "denominazione ambito territoriale sociale" in h)
          a_city = next(i for i,h in enumerate(ats_headers) if "nome comune" in h and "istat" in h)
          ats_data = ats_csv[1:]
          unique_ats_cities = {(r[a_region].strip(), r[a_city].strip()) for r in ats_data if len(r) > max(a_region,a_city)}
          unique_areas = {(r[a_region].strip(), r[a_area].strip()) for r in ats_data if len(r) > max(a_region,a_area)}

          if len(unique_health_cities) < 7800:
              raise SystemExit(f"National ASL municipality coverage unexpectedly low: {len(unique_health_cities)}")
          if len(unique_ats_cities) < 7800:
              raise SystemExit(f"ATS municipality coverage unexpectedly low: {len(unique_ats_cities)}")

          stats = {
              "asl_rows": asl_rows_count,
              "unique_comuni_asl": len(unique_health_cities),
              "health_authorities": len(unique_health_authorities),
              "ats_rows": len(ats_data),
              "unique_comuni_ats": len(unique_ats_cities),
              "social_areas": len(unique_areas),
              "health_source_updated": "28 mag 2026",
              "social_source_updated": "06 mar 2025",
              "sync": "settimanale",
              "last_sync_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          Path("data/territorial_stats.json").write_text(json.dumps(stats, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print("Coverage stats:", stats)

      - name: Write source metadata
        shell: bash
        run: |
          cat > data/asl_source.json <<'EOF'
          {
            "source": "Ministero della Salute - Corrispondenze ASL-Comuni e popolazione residente",
            "dataset_reference_year": 2024,
            "source_last_updated": "2026-05-28",
            "source_page": "https://www.dati.salute.gov.it/it/dataset/corrispondenze-asl-comuni-e-popolazione-residente-anno-2024/",
            "asl_registry_last_updated": "2026-04-23",
            "asl_registry_source_page": "https://www.dati.salute.gov.it/it/dataset/aziende-sanitarie-locali-asl/",
            "ats_registry_source": "Ministero del Lavoro e delle Politiche Sociali - Registro Ambiti Territoriali Sociali",
            "ats_registry_extract_date": "2025-03-06",
            "ats_registry_source_page": "https://www.lavoro.gov.it/strumenti-e-servizi/Sistema-informativo-servizi-sociali/Pagine/Ambiti-Territoriali-del-SIUSS",
            "license": "Italian Open Data Licence v2.0 where applicable; see source datasets",
            "sync": "automated weekly by GitHub Actions"
          }
          EOF

      - name: Commit changes if dataset changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "carevia-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asl_comuni.csv data/asl_elenco.csv data/ats_registry.xlsx data/ats_registry.csv data/asl_source.json data/territorial_stats.json
          if git diff --cached --quiet; then
            echo "No territorial dataset changes"
            exit 0
          fi
          git commit -m "Sync national health and social territorial data"
          git pull --rebase origin main
          git push
